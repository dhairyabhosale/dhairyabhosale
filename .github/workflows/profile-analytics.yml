name: Update Profile Analytics

on:
  push:
    branches: [main]
  schedule:
    - cron: "30 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate analytics SVGs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: dhairyabhosale
        run: |
          python - <<'PY'
          import json, os, urllib.request
          from collections import Counter
          from datetime import datetime, timezone

          token=os.environ['GH_TOKEN']; user=os.environ['USERNAME']
          H={'Accept':'application/vnd.github+json','Authorization':f'Bearer {token}','X-GitHub-Api-Version':'2022-11-28','User-Agent':'profile-analytics'}
          def get(url):
              r=urllib.request.Request(url,headers=H)
              with urllib.request.urlopen(r,timeout=30) as x: return json.load(x)
          u=get(f'https://api.github.com/users/{user}')
          repos=get(f'https://api.github.com/users/{user}/repos?per_page=100&sort=updated')
          repos=[r for r in repos if not r.get('fork')]
          stars=sum(r.get('stargazers_count',0) for r in repos)
          forks=sum(r.get('forks_count',0) for r in repos)
          langs=Counter()
          for r in repos:
              try:
                  for k,v in get(r['languages_url']).items(): langs[k]+=v
              except Exception: pass
          total=sum(langs.values()) or 1
          top=[(k,v*100/total) for k,v in langs.most_common(6)]
          events=get(f'https://api.github.com/users/{user}/events/public?per_page=100')
          now=datetime.now(timezone.utc); weeks=[0]*12
          for e in events:
              if e.get('type')!='PushEvent': continue
              try: dt=datetime.fromisoformat(e['created_at'].replace('Z','+00:00'))
              except Exception: continue
              age=(now-dt).total_seconds()/86400
              if 0<=age<84: weeks[11-min(11,int(age//7))]+=max(1,len(e.get('payload',{}).get('commits',[])))
          esc=lambda s:str(s).replace('&','&amp;').replace('<','&lt;').replace('>','&gt;')
          bg='#0D1117'; panel='#161B22'; text='#C9D1D9'; muted='#8B949E'; grid='#30363D'; pink='#E33F8E'; orange='#FF7A18'; purple='#A22FC4'
          stamp=now.strftime('%d %b %Y, %H:%M UTC')
          def stats():
              cards=[('PUBLIC REPOS',len(repos)),('TOTAL STARS',stars),('TOTAL FORKS',forks),('FOLLOWERS',u.get('followers',0))]
              s=[f'<svg xmlns="http://www.w3.org/2000/svg" width="900" height="210" viewBox="0 0 900 210"><rect width="900" height="210" rx="16" fill="{bg}"/><text x="38" y="40" fill="{text}" font-family="Arial" font-size="22" font-weight="700">GitHub Overview</text><text x="38" y="64" fill="{muted}" font-family="Arial" font-size="12">Public profile metrics • updated {esc(stamp)}</text>']
              for i,(lab,val) in enumerate(cards):
                  x=25+i*220; col=[pink,orange,purple,text][i]
                  s += [f'<rect x="{x}" y="88" width="205" height="92" rx="12" fill="{panel}" stroke="{grid}"/>',f'<text x="{x+18}" y="119" fill="{muted}" font-family="Arial" font-size="11" font-weight="700">{lab}</text>',f'<text x="{x+18}" y="155" fill="{col}" font-family="Arial" font-size="28" font-weight="700">{val}</text>']
              return ''.join(s)+'</svg>'
          def languages():
              s=[f'<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300"><rect width="900" height="300" rx="16" fill="{bg}"/><text x="38" y="42" fill="{text}" font-family="Arial" font-size="22" font-weight="700">Top Languages</text><text x="38" y="66" fill="{muted}" font-family="Arial" font-size="12">Across public, non-fork repositories</text>']
              cols=[pink,orange,purple,'#58A6FF','#3FB950','#F0883E']
              for i,(name,pct) in enumerate(top):
                  y=98+i*32; s += [f'<text x="38" y="{y+12}" fill="{text}" font-family="Arial" font-size="13">{esc(name)}</text>',f'<rect x="150" y="{y}" width="480" height="14" rx="7" fill="{panel}"/>',f'<rect x="150" y="{y}" width="{max(6,480*pct/100):.1f}" height="14" rx="7" fill="{cols[i%6]}"/>',f'<text x="650" y="{y+12}" fill="{muted}" font-family="Arial" font-size="12">{pct:.1f}%</text>']
              return ''.join(s)+'</svg>'
          def activity():
              mx=max(weeks) or 1; s=[f'<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330"><rect width="900" height="330" rx="16" fill="{bg}"/><text x="38" y="42" fill="{text}" font-family="Arial" font-size="22" font-weight="700">Public Activity</text><text x="38" y="66" fill="{muted}" font-family="Arial" font-size="12">Push activity visible through GitHub's public events API • last 12 weeks</text>']
              x0=60; y0=270; bw=44; gap=18
              for i,v in enumerate(weeks):
                  bh=int(v/mx*165); x=x0+i*(bw+gap); y=y0-bh; col=[pink,orange,purple][i%3]
                  s += [f'<rect x="{x}" y="{y}" width="{bw}" height="{max(3,bh)}" rx="6" fill="{col}"/>',f'<text x="{x+bw/2}" y="292" text-anchor="middle" fill="{muted}" font-family="Arial" font-size="10">W{i+1}</text>',f'<text x="{x+bw/2}" y="{max(90,y-8)}" text-anchor="middle" fill="{text}" font-family="Arial" font-size="10">{v}</text>']
              return ''.join(s)+f'<line x1="{x0}" y1="{y0}" x2="840" y2="{y0}" stroke="{grid}"/></svg>'
          os.makedirs('dist',exist_ok=True)
          open('dist/github-overview.svg','w').write(stats()); open('dist/top-languages.svg','w').write(languages()); open('dist/public-activity.svg','w').write(activity())
          PY
      - name: Publish analytics branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: analytics
          publish_dir: ./dist
          force_orphan: true
