<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" width="1000" height="240" role="img" aria-label="Dhairya Bhosale — Data Science student, builder, prompt engineer">
  <title>Dhairya Bhosale</title>
  <defs>
    <linearGradient id="base" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#FF7A18"/><stop offset="28%" stop-color="#FF4A3D"/><stop offset="55%" stop-color="#E33F8E"/><stop offset="80%" stop-color="#A22FC4"/><stop offset="100%" stop-color="#5D1C9E"/></linearGradient>
    <radialGradient id="b1" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#FF9A2E" stop-opacity="0.95"/><stop offset="100%" stop-color="#FF9A2E" stop-opacity="0"/></radialGradient>
    <radialGradient id="b2" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#FFB347" stop-opacity="0.9"/><stop offset="100%" stop-color="#FFB347" stop-opacity="0"/></radialGradient>
    <radialGradient id="b3" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#E01B24" stop-opacity="0.9"/><stop offset="100%" stop-color="#E01B24" stop-opacity="0"/></radialGradient>
    <radialGradient id="b4" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#F04FA6" stop-opacity="0.9"/><stop offset="100%" stop-color="#F04FA6" stop-opacity="0"/></radialGradient>
    <radialGradient id="b5" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#6B1FB0" stop-opacity="0.95"/><stop offset="100%" stop-color="#6B1FB0" stop-opacity="0"/></radialGradient>
    <radialGradient id="b6" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#C9308F" stop-opacity="0.75"/><stop offset="100%" stop-color="#C9308F" stop-opacity="0"/></radialGradient>
    <filter id="soften" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="42"/></filter>
    <pattern id="dots" width="9" height="9" patternUnits="userSpaceOnUse"><circle cx="1.8" cy="1.8" r="1.05" fill="#ffffff"/></pattern>
    <linearGradient id="dotFade" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#000000"/><stop offset="40%" stop-color="#2b2b2b"/><stop offset="72%" stop-color="#b4b4b4"/><stop offset="100%" stop-color="#ffffff"/></linearGradient>
    <radialGradient id="dotCorner" cx="88%" cy="8%" r="42%"><stop offset="0%" stop-color="#dddddd"/><stop offset="100%" stop-color="#000000"/></radialGradient>
    <mask id="dotMask"><rect width="1000" height="240" fill="url(#dotFade)"/><rect width="1000" height="240" fill="url(#dotCorner)" style="mix-blend-mode:screen"/></mask>
    <linearGradient id="sheen" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#ffffff" stop-opacity="0"/><stop offset="50%" stop-color="#ffffff" stop-opacity="0.16"/><stop offset="100%" stop-color="#ffffff" stop-opacity="0"/></linearGradient>
    <clipPath id="frame"><rect width="1000" height="240"/></clipPath>
    <style>
      .blob{animation:drift 7s ease-in-out infinite}.b-a{animation-duration:6s}.b-b{animation-duration:7.5s;animation-direction:reverse}.b-c{animation-duration:8.5s}.b-d{animation-duration:6.8s;animation-direction:reverse}.b-e{animation-duration:9s}.b-f{animation-duration:7.2s;animation-direction:reverse}
      @keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(-34px,20px)}}
      .name{font-family:"Segoe UI","Helvetica Neue",Helvetica,Arial,sans-serif;font-size:54px;font-weight:800;fill:#fff;letter-spacing:1.5px;animation:riseIn .7s cubic-bezier(.2,.7,.3,1) both}.role{font-family:"Segoe UI","Helvetica Neue",Helvetica,Arial,sans-serif;font-size:17px;font-weight:600;fill:#fff;fill-opacity:.92;letter-spacing:3.4px;animation:riseIn .7s cubic-bezier(.2,.7,.3,1) .18s both}.rule{animation:widen .8s cubic-bezier(.2,.7,.3,1) .32s both}
      @keyframes riseIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}} @keyframes widen{from{opacity:0;transform:scaleX(0)}to{opacity:1;transform:scaleX(1)}}
      .glare{animation:sweep 4.5s linear infinite}@keyframes sweep{0%{transform:translateX(-620px)}100%{transform:translateX(1240px)}}
      @media (prefers-reduced-motion:reduce){.blob,.name,.role,.rule,.glare{animation:none}}
    </style>
  </defs>
  <g clip-path="url(#frame)"><rect width="1000" height="240" fill="url(#base)"/><g filter="url(#soften)"><ellipse class="blob b-a" cx="150" cy="66" rx="300" ry="150" fill="url(#b1)"/><ellipse class="blob b-b" cx="470" cy="20" rx="300" ry="140" fill="url(#b2)"/><ellipse class="blob b-c" cx="900" cy="24" rx="270" ry="150" fill="url(#b3)"/><ellipse class="blob b-d" cx="170" cy="230" rx="300" ry="150" fill="url(#b4)"/><ellipse class="blob b-e" cx="930" cy="228" rx="290" ry="150" fill="url(#b5)"/><ellipse class="blob b-f" cx="600" cy="160" rx="270" ry="130" fill="url(#b6)"/></g><rect width="1000" height="240" fill="url(#dots)" mask="url(#dotMask)" opacity=".62"/><g class="glare"><rect x="0" y="-60" width="150" height="360" fill="url(#sheen)" transform="skewX(-18)"/></g><text class="name" x="60" y="120">DHAIRYA BHOSALE</text><rect class="rule" x="63" y="140" width="180" height="3" rx="1.5" fill="#fff" fill-opacity=".85"/><text class="role" x="62" y="176">DATA SCIENCE · BUILDER · PROMPT ENGINEER</text></g>
</svg>
